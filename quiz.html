<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Quiz do casal.">
<meta property="og:title" content="♥ Quiz ♥">
<meta property="og:description" content="Você me conhece bem?">
<meta property="og:image" content="images/casal2022.jpg">
<meta property="og:type" content="website">
<title>♥ Quiz ♥</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"></div>
<!-- NAV INJETADA -->
<div class="container">
  <div class="site-title title-lg">❓quiz❓</div>
  <div class="box"><p>quizao brabo</p></div>
  <div class="box">
    <div id="quiz-area"></div>
    <div class="btn-container">
      <button class="btn-retro" onclick="reiniciarQuiz()"> recomeçar</button>
    </div>
  </div>
</div>
<div class="rodape">Feito por Alberto</div>
<script src="js/geral.js"></script>
<script>
const perguntas = [
  { pergunta: "Em que dia a gente começou a namorar?(so te acordar)", opcoes: ["23/12/2025", "22/12/2025", "16/01/2025", "30/10/2024"], correta: 1 },
  { pergunta: "qual é a minha cor favorita?", opcoes: ["Laranja", "Azul", "Rosa e lilás", "Verde"], correta: 2 },
  { pergunta: "qual é a sua cor favorita?", opcoes: ["Laranja e azul-escuro", "Rosa", "azul-escuro", "Lilás"], correta: 0 },
  { pergunta: "Em que dia foi a aliança?", opcoes: ["21/05/2026", "22/12/2025", "21/06/2026", "22/05/2026"], correta: 0 },
  { pergunta: "qual é o nome do meu gato?", opcoes: ["cachorro", "Felix", "Ouvido", "Coraline"], correta: 1 }
];
let indiceAtual = 0; let acertos = 0;
function renderPergunta() {
  const area = document.getElementById("quiz-area");
  if (indiceAtual >= perguntas.length) {
    area.innerHTML = `<div id="quiz-resultado">Você acertou ${acertos} de ${perguntas.length}! 💗</div>`;
    return;
  }
  const p = perguntas[indiceAtual];
  let html = `<div class="quiz-pergunta">${indiceAtual + 1}. ${p.pergunta}</div><div class="quiz-opcoes">`;
  p.opcoes.forEach((opcao, i) => { html += `<button class="btn-retro" onclick="responder(${i})">${opcao}</button>`; });
  html += `</div>`; area.innerHTML = html;
}
function responder(i) {
  const p = perguntas[indiceAtual];
  if (i === p.correta) { acertos++; alert("Certo"); } else { alert("A resposta certa era: " + p.opcoes[p.correta]); }
  indiceAtual++; renderPergunta();
}
function reiniciarQuiz() { indiceAtual = 0; acertos = 0; renderPergunta(); }
renderPergunta();
</script>
</body>
</html>
