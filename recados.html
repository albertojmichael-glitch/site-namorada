<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Livro de recados do casal.">
<meta property="og:title" content="♥ Recados ♥">
<meta property="og:description" content="Deixe um recadinho carinhoso para a gente!">
<meta property="og:image" content="images/casal2022.jpg">
<meta property="og:type" content="website">
<title>♥ Recados ♥</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script src="js/geral.js" defer></script>
</head>
<body>
<div class="topbar"></div>
<nav class="topnav">
  <a href="index.html">🏠 início</a>
  <a href="memorias.html">💌 nossa história</a>
  <a href="fotos.html">📸 fotos</a>
  <a href="jogos.html">🎮 minijogos</a>
  <a href="recados.html">💬 recados</a>
</nav>

<div class="container">
  <div class="site-title title-lg">💬 Livro de Recados 💬</div>
  <div class="box">
    <h2>Deixe um recadinho ✎</h2>
    <input type="text" id="recado-nome" placeholder="seu apelido">
    <textarea id="recado-texto" rows="4" placeholder="escreva sua mensagem aqui..."></textarea>
    <div class="btn-container">
      <button class="btn-retro" onclick="enviarRecado()">💌 enviar Recado</button>
    </div>
  </div>
  <div class="box">
    <h2>Recados ✿</h2>
    <div id="lista-recados"><p>Carregando recados do servidor...</p></div>
  </div>
</div>
<div class="rodape">Feito por Alberto</div>
<script>
async function carregarRecados() {
  try {
    // Adicionado Date.now() para burlar o cache do celular
    const res = await fetch("api.php?action=get_recados&_t=" + Date.now());
    const lista = await res.json();
    const container = document.getElementById("lista-recados");
    if (lista.length === 0) {
      container.innerHTML = "<p>nenhum recado ainda...💗</p>";
      return;
    }
    container.innerHTML = lista.slice().reverse().map(r => `
      <div class="recado-item"><span>${r.data}</span><b>${r.nome}:</b> ${r.texto}</div>
    `).join("");
  } catch (error) { document.getElementById("lista-recados").innerHTML = "<p>nenhum recado ainda...</p>"; }
}
function enviarRecado() {
  const nome = document.getElementById("recado-nome").value.trim();
  const texto = document.getElementById("recado-texto").value.trim();
  if (!nome || !texto) { alert("preencha o nome e a mensagem"); return; }
  garantirEmail(async (email) => {
    const novoRecado = { nome, texto, email, data: new Date().toLocaleDateString("pt-BR") };
    try {
      await fetch("api.php?action=add_recado", { method: "POST", body: JSON.stringify(novoRecado) });
      document.getElementById("recado-nome").value = "";
      document.getElementById("recado-texto").value = "";
      alert("recado guardado");
      carregarRecados();
    } catch(e) { alert("Erro ao conectar."); }
  });
}
carregarRecados();
</script>
</body>
</html>
