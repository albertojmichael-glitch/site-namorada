<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>♥ Recados ♥</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar"></div>
<nav class="topnav">
  <a href="index.html">🏠 início</a>
  <a href="memorias.html">💌 nossa história</a>
  <a href="fotos.html">📸 fotos</a>
  <a href="jogos.html">🎮 minijogos</a>
  <a href="recados.html">💬 recados</a>
</nav>

<div class="container">

  <div class="site-title" style="font-size:30px;">💬 Livro de Recados 💬</div>

  <div class="box">
    <h2>Deixe um recadinho ✎</h2>
    <input type="text" id="recado-nome" placeholder="Seu nome">
    <textarea id="recado-texto" rows="4" placeholder="Escreva sua mensagem aqui..."></textarea>
    <div style="text-align:center;">
      <button class="btn-retro" onclick="enviarRecado()">💌 Enviar Recado</button>
    </div>
  </div>

  <div class="box">
    <h2>Recados ✿</h2>
    <div id="lista-recados"></div>
  </div>

</div>

<div class="rodape">
  Feito por Alberto
</div>

<script src="js/geral.js"></script>
<script>
// ================= LIVRO DE RECADOS =================
// Os recados ficam salvos no navegador de quem escreveu (localStorage).
// Obs: como é salvo local, cada pessoa/dispositivo vê os recados que
// escreveu no próprio navegador.

function carregarRecados() {
  return JSON.parse(localStorage.getItem("recadosSite") || "[]");
}

function salvarRecados(lista) {
  localStorage.setItem("recadosSite", JSON.stringify(lista));
}

function renderRecados() {
  const lista = carregarRecados();
  const container = document.getElementById("lista-recados");
  if (lista.length === 0) {
    container.innerHTML = "<p>Nenhum recado ainda... seja a primeira! 💗</p>";
    return;
  }
  container.innerHTML = lista
    .slice()
    .reverse()
    .map(r => `
      <div class="recado-item">
        <span>${r.data}</span>
        <b>${r.nome}:</b> ${r.texto}
      </div>
    `).join("");
}

function enviarRecado() {
  const nome = document.getElementById("recado-nome").value.trim();
  const texto = document.getElementById("recado-texto").value.trim();
  if (!nome || !texto) {
    alert("Preenche o nome e a mensagem antes de enviar! 😄");
    return;
  }
  const lista = carregarRecados();
  lista.push({
    nome,
    texto,
    data: new Date().toLocaleDateString("pt-BR")
  });
  salvarRecados(lista);
  document.getElementById("recado-nome").value = "";
  document.getElementById("recado-texto").value = "";
  renderRecados();
}

renderRecados();
</script>
</body>
</html>
