<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>♥ Jogo da Memória ♥</title>
<link rel="stylesheet" href="css/style.css">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nosso cantinho especial. Memórias, fotos e muito amor.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
</head>
<body>

<div class="topbar"></div>
<nav class="topnav">
  <a href="index.html">🏠 início</a>
  <a href="memorias.html">💌 nossa história</a>
  <a href="fotos.html">📸 fotos</a>
  <a href="jogos.html">🎮 minijogos</a>
  <a href="recados.html">💬 recados</a>
</nav>

<div class="container">

  <div class="site-title" style="font-size:30px;">🧠 jogo da memória 🧠</div>

  <div class="box">
    <h2>Como jogar</h2>
    <p>clica nas cartas pra virar e ache os pares das fotos</p>
    <p id="memoria-status">Tentativas: 0 | Pares encontrados: 0 / 6</p>
    <div style="text-align:center;">
      <button class="btn-retro" onclick="reiniciarJogo()">🔄 Reiniciar</button>
    </div>
  </div>

  <div class="memoria-grid" id="memoria-grid"></div>

  <div id="vitoria" class="banner-especial" style="display:none; font-size:18px;">
    🎉 VOCÊ GANHOU! 🎉 💗
  </div>

</div>

<div class="rodape">Feito por Alberto</div>
<script src="js/geral.js" defer></script>
<script>
const fotosJogo = [
  "images/casal2022.jpg", "images/daee.jpg", "images/sesc.jpg",
  "images/planta.jpg", "images/feliz_gato.jpg", "images/festinha2022.jpg"
];

let cartasViradas = [];
let paresEncontrados = 0;
let tentativas = 0;
let travado = false;

function embaralhar(array) {
  const copia = [...array, ...array];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function criarTabuleiro() {
  const grid = document.getElementById("memoria-grid");
  grid.innerHTML = "";
  const baralho = embaralhar(fotosJogo);

  baralho.forEach((foto, index) => {
    const carta = document.createElement("div");
    carta.className = "carta";
    carta.dataset.foto = foto;
    carta.innerHTML = `<span class="verso">💗</span><img loading="lazy" src="${foto}" alt="foto">`;
    carta.addEventListener("click", () => virarCarta(carta));
    grid.appendChild(carta);
  });
}

function virarCarta(carta) {
  if (travado || carta.classList.contains("virada") || carta.classList.contains("acertada") || cartasViradas.length >= 2) return;

  carta.classList.add("virada");
  cartasViradas.push(carta);

  if (cartasViradas.length === 2) {
    tentativas++;
    document.getElementById("memoria-status").textContent = `Tentativas: ${tentativas} | Pares encontrados: ${paresEncontrados} / ${fotosJogo.length}`;
    const [c1, c2] = cartasViradas;
    if (c1.dataset.foto === c2.dataset.foto) {
      c1.classList.add("acertada"); c2.classList.add("acertada");
      cartasViradas = []; paresEncontrados++;
      document.getElementById("memoria-status").textContent = `Tentativas: ${tentativas} | Pares encontrados: ${paresEncontrados} / ${fotosJogo.length}`;
      if (paresEncontrados === fotosJogo.length) document.getElementById("vitoria").style.display = "block";
    } else {
      travado = true;
      setTimeout(() => {
        c1.classList.remove("virada"); c2.classList.remove("virada");
        cartasViradas = []; travado = false;
      }, 800);
    }
  }
}

function reiniciarJogo() {
  cartasViradas = []; paresEncontrados = 0; tentativas = 0; travado = false;
  document.getElementById("vitoria").style.display = "none";
  document.getElementById("memoria-status").textContent = `Tentativas: 0 | Pares encontrados: 0 / ${fotosJogo.length}`;
  criarTabuleiro();
}

criarTabuleiro();
</script>
</body>
</html>
