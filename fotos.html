<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Galeria de fotos do casal.">
<title>♥ Galeria de Fotos ♥</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script src="js/geral.js" defer></script>
</head>
<body>
<div class="topbar"></div>
<!-- NAV INJETADA -->

<div class="container">
  <div class="site-title title-lg"> Galeria de Fotos </div>

  <div class="box text-center">
    <h3>Adicionar Nova Foto 📸</h3>
    <input type="file" id="file-foto" accept="image/*">
    <input type="text" id="desc-foto" placeholder="Descrição da foto">
    <button class="btn-retro" onclick="adicionarNovaFoto()">Adicionar ao Álbum</button>
  </div>

  <div class="banner-especial text-md">memórias incriveis</div>
  <div class="box">
    <div class="galeria" id="galeria-fotos">
      <div class="foto-card"><img loading="lazy" src="images/casal2022.jpg" alt="a gente 2022"><p>a gente 2022</p></div>
      <div class="foto-card"><img loading="lazy" src="images/daee.jpg" alt="a gente no daee"><p>a gente no daee</p></div>
      <div class="foto-card"><img loading="lazy" src="images/sesc.jpg" alt="a gente no sesc"><p>a gente no sesc</p></div>
      <div class="foto-card"><img loading="lazy" src="images/pedido.jpeg" alt="dias antes do pedido"><p>dias antes do pedido</p></div>
      <div class="foto-card"><img loading="lazy" src="images/sesc2.jpeg" alt="sesc novamente"><p>sesc novamente</p></div>
      <div class="foto-card"><img loading="lazy" src="images/sesc3.jpeg" alt="tarde no sesc"><p>tarde no sesc</p></div>
      <div class="foto-card"><img loading="lazy" src="images/sombrio.jpeg" alt="eu sombrio"><p>eu sombrio</p></div>
      <div class="foto-card"><img loading="lazy" src="images/crianca.jpg" alt="eu criança"><p>eu criança</p></div>
      <div class="foto-card"><img loading="lazy" src="images/daee2.jpg" alt="eu no daee"><p>eu no daee</p></div>
      <div class="foto-card"><img loading="lazy" src="images/daee3.jpeg" alt="a gente no daee 2"><p>a gente no daee 2</p></div>
      <div class="foto-card"><img loading="lazy" src="images/feliz_gato.jpg" alt="eu e o Feliz"><p>eu e o Felix</p></div>
    </div>
  </div>
</div>
<div class="rodape">Feito por Alberto</div>
<script>
async function carregarFotosExtras() {
  try {
    const res = await fetch("api.php?action=get_fotos");
    const fotos = await res.json();
    const galeria = document.getElementById("galeria-fotos");
    
    fotos.forEach(f => {
      const novaDiv = document.createElement("div");
      novaDiv.className = "foto-card";
      novaDiv.innerHTML = `<img loading="lazy" src="${f.url}" alt="${f.desc}"><p>${f.desc}</p><p style="font-size:10px;color:#999">Por: ${f.email}</p>`;
      galeria.appendChild(novaDiv);
    });
  } catch(e) { console.log("Backend offline."); }
}

function adicionarNovaFoto() {
  const fileInput = document.getElementById("file-foto");
  const desc = document.getElementById("desc-foto").value.trim();
  
  if(fileInput.files.length === 0) return alert("Escolha a foto!");
  if(!desc) return alert("Coloque uma descrição!");
  
  const fotoFile = fileInput.files[0];
  
  garantirEmail(async (email) => {
    const formData = new FormData();
    formData.append("foto", fotoFile);
    formData.append("desc", desc);
    formData.append("email", email);

    try {
      const btn = document.querySelector("button.btn-retro");
      const btnOriginalText = btn.innerText;
      btn.innerText = "Carregando... ⏳";
      const res = await fetch("api.php?action=upload_foto", { method: "POST", body: formData });
      const resultado = await res.json();
      btn.innerText = btnOriginalText;
      
      if (resultado.status === "sucesso") {
          alert("Foto enviada! ✨");
          setTimeout(() => location.reload(), 1500);
      } else { alert("Erro: " + (resultado.message || "Desconhecido")); }
    } catch(e) { alert("Erro no servidor."); }
  });
}
document.addEventListener("DOMContentLoaded", carregarFotosExtras);
</script>
</body>
</html>
