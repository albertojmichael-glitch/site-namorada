<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>♥ Galeria de Fotos ♥</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar"></div>
<nav class="topnav">
  <a href="index.html">🏠 início</a>
  <a href="memorias.html">💌 nossa história</a>
  <a href="fotos.html">📸 fotos</a>
  <a href="jogos.html">🎮 minijogos</a>
  <a href="recados.html">💬 recados</a>
</nav>

<div class="container">
  <div class="site-title" style="font-size:32px;"> Galeria de Fotos </div>

  <div class="box" style="text-align: center;">
    <h3>Adicionar Nova Foto 📸</h3>
    <input type="text" id="url-foto" placeholder="Cole o link (URL) da imagem aqui">
    <input type="text" id="desc-foto" placeholder="Descrição da foto">
    <button class="btn-retro" onclick="adicionarNovaFoto()">Adicionar ao Álbum</button>
  </div>

  <div class="banner-especial" style="font-size:18px;">memórias incriveis</div>
  <div class="box">
    <div class="galeria" id="galeria-fotos">
      <!-- Fotos fixas originais -->
      <div class="foto-card"><img src="images/casal2022.jpg" alt="a gente 2022"></div>
      <div class="foto-card"><img src="images/daee.jpg" alt="a gente no daee"></div>
      <div class="foto-card"><img src="images/sesc.jpg" alt="a gente no sesc"></div>
      <div class="foto-card"><img src="images/pedido.jpeg" alt="dias antes do pedido"></div>
    </div>
  </div>
</div>
<div class="rodape">Feito por Alberto</div>
<script src="js/geral.js"></script>
<script>
// ================= INTEGRAÇÃO COM BACKEND PHP =================
async function carregarFotosExtras() {
  try {
    const res = await fetch("api.php?action=get_fotos");
    const fotos = await res.json();
    const galeria = document.getElementById("galeria-fotos");
    
    fotos.forEach(f => {
      const novaDiv = document.createElement("div");
      novaDiv.className = "foto-card";
      novaDiv.innerHTML = `<img src="${f.url}" alt="${f.desc}"><p>${f.desc}</p><p style="font-size:10px;color:#999">Por: ${f.email}</p>`;
      galeria.appendChild(novaDiv);
    });
  } catch(e) {
    console.log("Backend offline, mostrando apenas fotos locais.");
  }
}

function adicionarNovaFoto() {
  const url = document.getElementById("url-foto").value.trim();
  const desc = document.getElementById("desc-foto").value.trim();
  if(!url) return alert("Ei, faltou colocar o link da foto!");
  
  garantirEmail(async (email) => {
    const novaFoto = { url, desc, email };
    try {
      await fetch("api.php?action=add_foto", {
        method: "POST", body: JSON.stringify(novaFoto)
      });
      alert("Foto salva para sempre na nossa história! ✨");
      setTimeout(() => location.reload(), 1500);
    } catch(e) {
      alert("Erro ao conectar no servidor.");
    }
  });
}
document.addEventListener("DOMContentLoaded", carregarFotosExtras);
</script>
</body>
</html>
