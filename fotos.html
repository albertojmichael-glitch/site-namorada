</div>

<script src="js/geral.js"></script>


<script>
  function carregarFotosExtras() {
    const galeria = document.querySelector(".galeria");
    const fotos = JSON.parse(localStorage.getItem("fotosExtras") || "[]");
    
    fotos.forEach(f => {
      const novaDiv = document.createElement("div");
      novaDiv.className = "foto-card";
      novaDiv.innerHTML = `<img src="${f.url}" alt="${f.desc}"><p>${f.desc}</p>`;
      galeria.appendChild(novaDiv);
    });
  }

  function adicionarNovaFoto() {
    const url = document.getElementById("url-foto").value;
    const desc = document.getElementById("desc-foto").value;
    
    if(!url) return alert("Coloque o link da foto!");
    
    const fotos = JSON.parse(localStorage.getItem("fotosExtras") || "[]");
    fotos.push({ url, desc });
    localStorage.setItem("fotosExtras", JSON.stringify(fotos));
    
    location.reload(); 
  }

  document.addEventListener("DOMContentLoaded", carregarFotosExtras);
</script>
